name: Deploy portal to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每週一至週五低頻排程（降低 GitHub Actions 限流與延遲機率）：
    # 臺灣時間 09:30 (UTC 01:30)、11:30 (UTC 03:30)、13:45 (UTC 05:45)、14:30 (UTC 06:30 備援)
    - cron: '30 1 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 自動抓取最新 TWSE 加權指數資料並寫入 static/data/taiex.json（資料未變動時腳本會自動略過寫入）
      - name: Fetch latest TWSE stock data
        run: |
          node tool/PP00_Gather/scripts/update_taiex.js || echo "TWSE fetch warning, continuing with existing cache"

      # 若有新收盤數據，自動 commit 回 main 分支保持專案資料庫同步
      - name: Commit updated stock data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tool/PP00_Gather/static/data/taiex.json
          git diff --staged --quiet || (git commit -m "📈 自動更新台股大盤盤後指數 [skip ci]" && git push || echo "Push skipped")

      # The portal and tools are already built and committed as static files.
      - name: Stage website
        run: |
          mkdir _site
          cp index.html logo.png pp00_agent.png unlock_irm.jpg _site/
          cp -R tool _site/tool
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
